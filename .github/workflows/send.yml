name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    # 准时发送机制：北京时间 10:00-13:55 每 5 分钟轮询一次。
    # 真正的发送时刻由 SEND_AT 决定（默认 12:05），只有命中
    # SEND_AT 之后、且当天尚未发送的那一次轮询才会真正发送；
    # 其余轮询在 check job 即结束，不安装依赖、不消耗分钟。
    - cron: "*/5 10-13 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  # 同一时刻只保留一个运行中的工作流，后续轮询排队等待（而非取消），
  # 确保“发送”与“写入当天已发送标记”串行完成，从机制上避免重复发送。
  group: douyin-daily-sender
  cancel-in-progress: false

env:
  # 目标发送时间（北京时间 HH:MM）。可在仓库
  # Settings -> Secrets and variables -> Actions -> Variables 中
  # 新增 DOUYIN_SEND_AT 覆盖，未设置时默认 12:05。
  SEND_AT: ${{ vars.DOUYIN_SEND_AT || '12:05' }}

jobs:
  # —— 判定：是否需要在本次轮询发送（便宜，几乎不耗分钟）——
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_send: ${{ steps.finalize.outputs.should_send }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve clock in Asia/Shanghai
        id: clock
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(TZ=Asia/Shanghai date +%s)" >> "$GITHUB_OUTPUT"

      - name: Wait for send time
        id: timegate
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          target=$(TZ=Asia/Shanghai date -d "$SEND_AT" +%s)
          if [ "${{ steps.clock.outputs.epoch }}" -lt "$target" ]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "尚未到发送时间 $SEND_AT"
          else
            echo "should_send=true" >> "$GITHUB_OUTPUT"
            echo "已到发送时间 $SEND_AT"
          fi

      - name: Restore sent-today marker
        id: marker
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .sent-marker
          key: douyin-sent-${{ steps.clock.outputs.date }}

      - name: Finalize decision
        id: finalize
        shell: bash
        run: |
          should_send="true"
          if [ "${{ github.event_name }}" == "schedule" ]; then
            if [ "${{ steps.timegate.outputs.should_send }}" == "false" ]; then
              should_send="false"
            fi
            if [ "${{ steps.marker.outputs.cache-hit }}" == "true" ]; then
              should_send="false"
              echo "今天已发送，跳过本轮"
            fi
          fi
          echo "should_send=$should_send" >> "$GITHUB_OUTPUT"
          echo "本次决定: should_send=$should_send"

  # —— 发送：仅当 check 判定需要发送时执行 ——
  send:
    needs: check
    if: needs.check.outputs.should_send == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not any(os.environ.get(f"COOKIE_{i}") for i in range(1, 6)):
              # 没有配置任何多账号 Secret（DOUYIN_COOKIE_ACCOUNTn）：
              # 保持旧单账号模式，不生成 accounts.json。
              print("未配置多账号 Secret，继续使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  # 没有配置 DOUYIN_COOKIE_ACCOUNT1 时，旧版 DOUYIN_COOKIE /
                  # DOUYIN_CONFIG 自动作为账号1，方便老用户直接追加新账号。
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"账号 account{index} 的 DOUYIN_COOKIE_ACCOUNT{index} 与 "
                      f"DOUYIN_CONFIG_ACCOUNT{index} 必须同时配置"
                  )
              # 提前校验，出错时直接指出是哪个 Secret，避免任务执行时才报错
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_CONFIG_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              env_file = f".env.account{index}"
              # Cookie 用 JSON 字符串转义后写入，dotenv 可精确还原，
              # 兼容多行 Cookie JSON 与 # 等特殊字符
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Run
        id: run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi

      # 发送尝试完成后（无论成败）写入“今日已发送”标记，避免当天后续
      # 轮询重复发送。仅当真正执行到发送步骤（run 未因前置失败被跳过）时写标记。
      - name: Mark sent today
        id: mark
        if: github.event_name == 'schedule' && steps.run.outcome != 'skipped'
        shell: bash
        run: |
          mkdir -p .sent-marker
          date > .sent-marker/done
          echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Save sent-today marker
        if: github.event_name == 'schedule' && steps.run.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .sent-marker
          key: douyin-sent-${{ steps.mark.outputs.date }}

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
